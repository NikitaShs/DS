  direction-servise:
    container_name: PetDS
    build:
      context: ./backend
      dockerfile: ./PetDS/src/PetDS.Web/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_PASSWORD: ${NUGET_PASSWORD}
    ports:
      - "8001:8001"
    depends_on:
      - postgres-departaments
      - minio
      - rabbitmq
      - seq
    restart: always

  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - 5341:5341
      - 8081:80

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password
    command: server --console-address ":9001" /data
    restart: always
  rabbitmq:
    container_name: rebbitmq
    image: rabbitmq:management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always

  postgres-file:
      image: postgres
      restart: always
      environment:
        POSTGRES_DB: FileSer
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: Servise5
      ports:
        - "1346:5432"
      volumes:
        - postgres-file-data:/var/lib/postgresql/data

  postgres-departaments:
      image: postgres
      restart: always
      environment:
        POSTGRES_DB: Nizhny
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: Nowgorod
      ports:
        - "1347:5432"
      volumes:
        - postgres-departaments-data:/var/lib/postgresql/data

  postgres-notification:
      image: postgres
      restart: always
      environment:
        POSTGRES_DB: notif
        POSTGRES_USER: name
        POSTGRES_PASSWORD: pas
      ports:
        - "1348:5432"
      volumes:
        - postgres-notification-data:/var/lib/postgresql/data
  mailhog:
    image: mailhog/mailhog
    ports: 
      - 1025:1025
      - 8025:8025

  # ============================================
  # Loki — хранилище логов
  # ============================================
  loki:
    image: grafana/loki:3.7.1
    container_name: setu-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: always
  # ============================================
  # Grafana Alloy — сбор логов с Docker контейнеров
  # ============================================
  alloy:
    image: grafana/alloy:v1.16.1
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345" # UI самого Alloy для отладки
    depends_on:
      - loki
    restart: always


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      #- ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - loki    # ← убрали лишнее, оставили только имя сервиса

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    container_name: setu-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    expose:
      - "4317" # OTLP gRPC — приём метрик от сервисов
      - "4318" # OTLP HTTP
      - "9464" # /metrics для Prometheus (внутри docker-сети)
      - "8888" # внутренние метрики самого коллектора
      - "13133" # health_check extension
    ports:
      # Публикуем OTLP-порты наружу для локальной отладки
      # (например, отправить тестовую метрику с хоста через otel-cli).
      # На проде эти порты можно закрыть — сервисы и так в docker-сети.
      - "4317:4317"
      - "4318:4318"
    restart: always

  # Prometheus — TSDB и движок PromQL. Скрейпит /metrics у otel-collector.
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: setu-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Позволяет hot-reload по POST /-/reload — удобно при правке prometheus.yml.
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090" # UI Prometheus (PromQL, Targets, Status)
    depends_on:
      - otel-collector
    restart: always

volumes:
  postgres-file-data:
  postgres-departaments-data:
  postgres-notification-data:
  rabbitmq-data:
  loki-data:
  grafana-data:
  alloy-data:
  prometheus-data: