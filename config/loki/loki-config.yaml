# Включает или отключает встроенную авторизацию Loki; false значит, что Loki принимает запросы без проверки пользователя.
auth_enabled: false

# Раздел с настройками HTTP/gRPC-сервера Loki.
server:
  # Порт, на котором Loki слушает HTTP-запросы от Grafana, Promtail и других клиентов.
  http_listen_port: 3100

# Общие настройки, которые Loki использует в разных внутренних компонентах.
common:
  # Базовая директория внутри контейнера, куда Loki складывает свои рабочие файлы.
  path_prefix: /loki
  # Настройки хранилища для данных Loki.
  storage:
    # Указывает, что данные хранятся в локальной файловой системе, а не в S3/GCS/Azure.
    filesystem:
      # Директория, где Loki хранит чанки - сжатые блоки логов.
      chunks_directory: /loki/chunks
      # Директория, где Loki хранит правила, например правила алертов или записи.
      rules_directory: /loki/rules
  # Количество копий данных; 1 подходит для локального/одиночного Loki без кластера.
  replication_factor: 1
  # Настройки ring - механизма, через который компоненты Loki находят друг друга в кластере.
  ring:
    # Хранилище состояния ring.
    kvstore:
      # Хранит состояние ring только в памяти процесса; подходит для одиночного Loki.
      store: inmemory

# Ограничения и дополнительные возможности, которые применяются к принимаемым и хранимым логам.
limits_config:
  # Разрешает хранить структурированные метаданные вместе с логами.
  allow_structured_metadata: true
  # Хранит логи 72 часа, то есть 3 дня, после чего они могут быть удалены.
  retention_period: 72h
  # Автоматически определяет уровень логирования, например info/error/debug, из JSON-полей.
  discover_log_levels: true

# Настройки compactor - компонента, который уплотняет индекс и отвечает за удаление старых данных.
compactor:
  # Рабочая директория compactor для временных файлов и служебного состояния.
  working_directory: /loki/compactor
  # Как часто compactor запускает уплотнение данных.
  compaction_interval: 10m
  # Включает удаление данных по retention_period из limits_config.
  retention_enabled: true
  # Задержка перед физическим удалением данных после того, как они попали под retention.
  retention_delete_delay: 2h
  # Где хранить запросы на удаление; filesystem значит локальная файловая система.
  delete_request_store: filesystem

# Описывает схему хранения индексов и логов.
schema_config:
  # Список схем, которые Loki применяет начиная с указанных дат.
  configs:
    # Дата, с которой начинает действовать эта схема хранения.
    - from: 2020-10-24
      # Тип хранилища индекса; tsdb - современный формат индекса Loki.
      store: tsdb
      # Где хранятся объекты с данными; filesystem значит локальные файлы.
      object_store: filesystem
      # Версия схемы Loki; v13 нужна для актуального TSDB-хранилища.
      schema: v13
      # Настройки индекса для этой схемы.
      index:
        # Префикс имен файлов/таблиц индекса.
        prefix: index_
        # Период, на который разбивается индекс; 24h значит один индекс на сутки.
        period: 24h
